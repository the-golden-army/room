name: build
on:
  push:
    branches: ["arena/**"]
    paths: ["src/**", "Cargo.toml", "migrations/**", ".github/workflows/build.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: |
          cargo check --all-targets > check.log 2>&1
          echo "CHECK_EXIT=$?" >> check.log
          tail -3 check.log
      - name: Build
        if: ${{ success() }}
        run: |
          cargo build --release > build.log 2>&1
          echo "BUILD_EXIT=$?" >> build.log
          tail -3 build.log
      - name: Package
        if: ${{ success() }}
        run: |
          mkdir -p dist
          cp target/release/room dist/room
          tar czf dist/room-linux-x64.tar.gz -C dist room
          sha256sum dist/room-linux-x64.tar.gz > dist/room-linux-x64.tar.gz.sha256
      - name: Commit artifacts
        if: ${{ always() }}
        run: |
          git config user.name "room-ci"
          git config user.email "ci@room.local"
          [ -f check.log ] || echo "check.log missing" > check.log
          [ -f build.log ] || echo "build.log missing" > build.log
          [ -d dist ] || mkdir -p dist
          for f in check.log build.log Cargo.lock; do [ -f "$f" ] && git add -f "$f"; done
          git add -f dist 2>/dev/null || true
          git commit -m "[ci] build artifacts + logs" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

name: build
on:
  push:
    branches: [arena/d5844c38-room]
    paths: ["src/**", "Cargo.toml", "migrations/**", ".github/workflows/build.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check
        run: |
          cargo check --all-targets > check.log 2>&1
          echo "CHECK_EXIT=$?" >> check.log
          tail -5 check.log
      - name: Build
        if: ${{ success() }}
        run: |
          cargo build --release > build.log 2>&1
          echo "BUILD_EXIT=$?" >> build.log
          tail -5 build.log
      - name: Package
        if: ${{ success() }}
        run: |
          mkdir -p dist
          cp target/release/room dist/room
          tar czf dist/room-linux-x64.tar.gz -C dist room
          sha256sum dist/room-linux-x64.tar.gz > dist/room-linux-x64.tar.gz.sha256
      - name: Commit artifacts
        if: ${{ always() }}
        run: |
          git config user.name "room-ci"
          git config user.email "ci@room.local"
          git add -f dist Cargo.lock check.log build.log 2>/dev/null || true
          git commit -m "[ci] build artifacts + logs" || true
          git push origin HEAD:arena/d5844c38-room || true

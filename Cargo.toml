[package]
name = "room"
version = "0.1.0"
edition = "2021"
description = "ROOM — self-hosted local communication & collaboration platform"
license = "MIT"

[[bin]]
name = "room"
path = "src/main.rs"

[dependencies]
actix = "0.13"
actix-web = "4.9"
actix-web-actors = "4.3"
actix-files = "0.6"
actix-multipart = "0.7"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"
percent-encoding = "2"

[profile.release]
strip = true
opt-level = 2
